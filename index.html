<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertifPlus Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #004494; }
    </style>
</head>

<body>
    <div class="container">
        <h1>CertifPlus Portal</h1>

        <div id="section-login" class="section" style="background-color: #e9ecef;">
            <h2>University Login (SSO)</h2>
            <form action="/login" method="POST">
                <label for="username">Unilim ID:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit" style="background-color: #d22d2d; color: white;">Authenticate</button>
            </form>
        </div>

        <div id="section-student" class="section" style="display:none;">
            <h2>Student Portal</h2>
            <p>Logged in as <b id="user-display"></b> | <a href="/logout">Logout</a></p>
            <form action="/creation" method="POST">
                <label for="identity">First and Last Name:</label>
                <input type="text" id="identity" name="identity" required placeholder="Ex: Theo Barbey">
                
                <label for="certif_title">Title:</label>
                <input type="text" id="certif_title" name="certif_title" required placeholder="Ex: Master CRYPTIF">
                
                <button type="submit">Generate my certificate</button>
            </form>
        </div>

        <div class="section">
            <h2>Employer Portal</h2>
            <form action="/verification" method="POST" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/png" required>
                <button type="submit" style="background-color: #28a745;">Verify a diploma</button>
            </form>
        </div>
    </div>
    <script>
        // Small script to check if logged in
        function checkLogin() {
            // Looking for the cookie
            if (document.cookie.includes("session_sso")) {
                document.getElementById('section-login').style.display = 'none';
                document.getElementById('section-student').style.display = 'block';
                document.getElementById('user-display').innerText = "Authorized User";
            }
        }
        window.onload = checkLogin;
    </script>
</body>
</html>
